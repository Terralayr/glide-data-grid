# Publish stable releases to GitHub Packages on v* tags (excluding prerelease tags).

name: Release CI

on:
    push:
        tags:
            - "v*"
            - "!v*-*"

permissions:
    contents: read
    packages: write

jobs:
    publish-core:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.19.0
                  registry-url: https://npm.pkg.github.com
                  scope: "@Terralayr"
            - name: Bootstrap
              run: npm install && npm run build
            - name: Publish core
              run: npm publish
              working-directory: ./packages/core
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    publish-cells:
        runs-on: ubuntu-latest
        needs: publish-core
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.19.0
                  registry-url: https://npm.pkg.github.com
                  scope: "@Terralayr"
            - name: Bootstrap
              run: npm install && npm run build
            - name: Publish cells
              run: npm publish
              working-directory: ./packages/cells
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    publish-source:
        runs-on: ubuntu-latest
        needs: publish-core
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.19.0
                  registry-url: https://npm.pkg.github.com
                  scope: "@Terralayr"
            - name: Bootstrap
              run: npm install && npm run build
            - name: Publish source
              run: npm publish
              working-directory: ./packages/source
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
